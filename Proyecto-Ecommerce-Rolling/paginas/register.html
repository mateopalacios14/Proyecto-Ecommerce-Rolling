<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de usuario</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 0;
    }
    .card-custom {
      border: none;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      max-width: 450px;
      width: 100%;
    }
    .btn-gradient {
      background: linear-gradient(45deg, #2575fc, #6a11cb);
      color: white;
      border: none;
      transition: transform 0.2s;
    }
    .btn-gradient:hover {
      transform: translateY(-2px);
      color: white;
      box-shadow: 0 5px 15px rgba(37, 117, 252, 0.4);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">
        <div class="card card-custom p-4 bg-white">
          <div class="text-center mb-4">
            <h2 class="fw-bold text-dark">Registro de usuario 📚</h2>
            <p class="text-muted small">Complete el formulario con toda la información que pide cada campo para registrarse🗣️  </p>
          </div>

          <form>
            <h5 class="fw-semibold text-secondary mb-3 border-bottom pb-2">Información personal</h5>

            <!-- Campo Nombre -->
            <div class="mb-3">
              <label for="nombre" class="form-label text-start d-block fw-semibold">Nombre</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="nombre" placeholder="Ingrese sus nombres" required placeholder="ingrese sus nombrre " minlength="6" maxlength="20" >
              </div>
            </div>


<!-- Campo usuario -->
            <div class="mb-3">
              <label for="nombre" class="form-label text-start d-block fw-semibold">Nombre de usuario</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="nombre usuario" placeholder="Ingrese su usuario" required placeholder="ingrese su usuario" minlength="6">
              </div>
            </div>






            <!-- Campo Teléfono -->
            <div class="mb-3">
              <label for="telefono" class="form-label text-start d-block fw-semibold">Teléfono</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-telephone"></i></span>
                <input type="tel" class="form-control"  required id="Telefono"  pattern="^\d{10}$" placeholder="Ingrese su número de teléfono" >
              </div>
            </div>

            <!-- Campo Email -->
            <div class="mb-4">
              <label for="email" class="form-label text-start d-block fw-semibold">Email</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email" placeholder="ejemplola@gmail.com" required>
              </div>
            </div>

<!-- Campo contraseña -->
            <div class="mb-3">
              <label for="nombre" class="form-label text-start d-block fw-semibold">Contraseña</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="nombre" placeholder="Cree su contraseña" required placeholder="ingrese sus nombres " minlength="6"
maxlength="20" >
              </div>
            </div>
            <!-- Campo contraseña -->
            <div class="mb-3">
              <label for="nombre" class="form-label text-start d-block fw-semibold">Contraseña</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="nombre" placeholder="Escriba su contraseña nuevamente" required placeholder="ingrese sus nombres " minlength="6"
maxlength="20" >
              </div>
            </div>








            <!-- Botón de Envío -->
            <button type="submit" class="btn btn-gradient w-100 py-2 fw-bold">Registrarse</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
