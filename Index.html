<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>

    <nav class="navbar navbar-expand-lg">

        <div class="container-fluid">

            <!-- LOGO -->
            <a class="navbar-brand" href="/Index.html">
                <img src="assets/img/logo.png" class="imagen-tienda" alt="Libro">
            </a>


            <!-- BOTÓN MOBILE -->
            <button 
                class="navbar-toggler" 
                type="button" 
                data-bs-toggle="collapse" 
                data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" 
                aria-expanded="false" 
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>


            <div class="collapse navbar-collapse" id="navbarSupportedContent">

                <ul class="navbar-nav me-auto mb-2 mb-lg-0">


                   

                    <li class="nav-item">
                        <a class="nav-link fw-bold" href="paginas/nosotros.html">
                            Nosotros
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link fw-bold" href="paginas/contacto.html">
                            Contacto
                        </a>
                    </li>

                </ul>


                <form class="d-flex me-2" role="search">

                    <input 
                        class="form-control me-2" 
                        type="search" 
                        placeholder="Buscar..."
                        aria-label="Buscar">

                    <button 
                        class="btn btn-outline-success " 
                        type="button"
                        onclick="window.location.href='paginas/ERROR.html'">
                    
                        Buscar

                    </button>

                </form>


              <a class="navbar-brand" href="paginas/carrito.html">
                <img src="assets/img/carrito-logo.png" class="imagen-tienda" alt="Libro">
            </a>


                <button 
                    type="button" 
                    class="btn btn-primary"
                    data-bs-toggle="modal" 
                    data-bs-target="#loginModal">

                    Login

                </button>

            </div>

        </div>

    </nav>


    <div 
        class="modal fade" 
        id="loginModal" 
        tabindex="-1" 
        aria-labelledby="loginModalLabel" 
        aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">

                    <h1 class="modal-title fs-5" id="loginModalLabel">
                        Iniciar sesión
                    </h1>

                    <button 
                        type="button" 
                        class="btn-close" 
                        data-bs-dismiss="modal" 
                        aria-label="Cerrar">
                    </button>

                </div>


                <div class="modal-body">

                    <form>

                        <div class="mb-3">

                            <label for="email" class="form-label">
                                Correo electrónico
                            </label>

                            <input 
                                type="email" 
                                class="form-control" 
                                id="email"
                                placeholder="ejemplo@gmail.com">

                        </div>


                        <div class="mb-3">

                            <label for="password" class="form-label">
                                Contraseña
                            </label>

                            <input 
                                type="password" 
                                class="form-control" 
                                id="password"
                                placeholder="Contraseña">

                        </div>


                        <button 
                            type="submit" 
                            class="btn btn-primary w-100">

                            Iniciar sesión

                        </button>

                    </form>

                </div>


                <div class="modal-footer">

                    <span>
                        ¿No tenés una cuenta?
                    </span>

                    <a href="paginas/register.html">
                        Registrate
                    </a>

                </div>

            </div>

        </div>

    </div>

</header>








    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
